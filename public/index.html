<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Event Crawler</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        max-width: 860px;
        margin: 30px auto;
        padding: 0 18px;
        color: #1f2937;
      }
      h1 { margin-bottom: 10px; }
      p.help { color: #4b5563; margin-bottom: 22px; }
      form {
        display: grid;
        grid-template-columns: 2fr 2fr auto;
        gap: 10px;
        margin-bottom: 18px;
      }
      input, button {
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        font-size: 14px;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
      }
      button:disabled { opacity: .6; cursor: not-allowed; }
      .meta { color: #6b7280; font-size: 13px; margin: 6px 0 16px; }
      .error { color: #b91c1c; margin-bottom: 14px; }
      #events {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 10px;
      }
      #events li {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        background: #f8fafc;
      }
      .title { font-weight: 700; margin-bottom: 4px; }
      .sub { color: #374151; font-size: 14px; margin-bottom: 3px; }
      .source { font-size: 12px; color: #6b7280; }
      @media (max-width: 720px) {
        form { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <h1>Find Events Near You</h1>
    <p class="help">This app crawls public web pages and extracts structured event listings (JSON-LD) for a location.</p>

    <form id="search-form">
      <input id="location" placeholder="Location (e.g., Austin, TX)" required />
      <input id="keyword" placeholder="Keyword (e.g., music, startup, food)" value="events" />
      <button type="submit" id="search-btn">Search</button>
    </form>

    <div class="meta" id="meta"></div>
    <div class="error" id="error"></div>
    <ul id="events"></ul>

    <script>
      const form = document.getElementById("search-form");
      const locationInput = document.getElementById("location");
      const keywordInput = document.getElementById("keyword");
      const eventsList = document.getElementById("events");
      const meta = document.getElementById("meta");
      const errorEl = document.getElementById("error");
      const searchBtn = document.getElementById("search-btn");

      function renderEvents(events) {
        eventsList.innerHTML = "";

        if (!events.length) {
          const li = document.createElement("li");
          li.textContent = "No events found. Try a nearby city or broader keyword.";
          eventsList.appendChild(li);
          return;
        }

        events.forEach((event) => {
          const li = document.createElement("li");
          li.innerHTML = `
            <div class="title">${event.title}</div>
            <div class="sub">📍 ${event.venue} — ${event.address}</div>
            <div class="sub">🗓 ${new Date(event.startDate).toLocaleString()}</div>
            <div class="source">Source: ${event.source} · <a href="${event.url}" target="_blank" rel="noopener noreferrer">Open event page</a></div>
          `;
          eventsList.appendChild(li);
        });
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.textContent = "";
        meta.textContent = "Searching...";
        eventsList.innerHTML = "";
        searchBtn.disabled = true;

        try {
          const response = await fetch("/api/events/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              location: locationInput.value.trim(),
              keyword: keywordInput.value.trim() || "events",
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            errorEl.textContent = data.error || "Search failed.";
            meta.textContent = "";
            return;
          }

          meta.textContent = `Scanned ${data.scannedPages} pages · Found ${data.foundEvents} events near ${data.location}.`;
          renderEvents(data.events);
        } catch {
          meta.textContent = "";
          errorEl.textContent = "Could not complete search. Please try again.";
        } finally {
          searchBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
